# Firmware settings for the snowy board (Pebble Time and Time Steel).

CONFIG_WATCHDOG=y

CONFIG_MAG=y
CONFIG_PMIC=y

# Keep the dark threshold set on the watch, off the phone's settings sync.
CONFIG_ALS_THRESHOLD_LOCAL=y
CONFIG_DYNAMIC_BACKLIGHT=y

# Settings: motion sensitivity and left-handed (rotated) wear
CONFIG_ACCEL_SENSITIVITY=y
CONFIG_ORIENTATION_MANAGER=y

# System resources (fonts aside) drawn straight from the memory-mapped NOR,
# as the stock firmware did: the kernel heap is too small to copy the larger
# vector animations (the incoming call one is 13.6K).
CONFIG_MMAP_RESOURCES=y

# Album art and notification pictures: one 4-bpp image (6.5-9K) at a time in
# the kernel heap; one that does not fit is dropped.
CONFIG_SERVICE_IMAGING_PICTURES=y
# Little kernel heap: the Music app keeps the cover in its own heap.
CONFIG_SERVICE_IMAGING_ALBUM_ART_APP_HEAP=y

# No LE Audio: drop the ISO buffer pool, kernel heap is scarce on the F439.
CONFIG_NIMBLE_BLE_TRANSPORT_ISO_COUNT=0

# The CC2564B (Bluetooth 4.1) has no LE Secure Connections: legacy pairing,
# with MITM protection required (the watch shows a passkey that the phone's
# user types), so nothing pairs by Just Works while the watch is pairable.
# (Secure Connections only, with MITM, wedged phones in the pebble-dev
# firmware.) No host flow control (the pebble-dev firmware had
# it): the CC2564 sent more ACL packets than the host had buffers for, so
# NimBLE reset itself as soon as an app download started. UART flow control
# holds the controller off instead while the host is busy.
CONFIG_NIMBLE_BLE_SM_SC_ONLY=n
CONFIG_NIMBLE_BLE_SM_LEGACY=y
CONFIG_NIMBLE_BLE_SM_MITM=y
CONFIG_NIMBLE_BLE_SM_LVL=3

# The SDK packaged from this firmware is the basalt/chalk SDK at this revision,
# with the font tool the resource maps use.
CONFIG_SDK_UNFROZEN=y
CONFIG_SDK_FONT_GLYPH_SUBSET=y

# Keep two core dumps, as on the other boards with room for them.
CONFIG_COREDUMP_BACKEND_FLASH_IMAGES=2

# The watch advertises as the stock firmware did: Pebble's company identifier in
# the advertisements and its name in the Device Information Service.
CONFIG_BT_VENDOR_ID=0x0154
CONFIG_BT_VENDOR_NAME="Pebble Technology"
