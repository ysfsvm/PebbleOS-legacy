compatible: st,stm32-uart
config: UART_STM32
class: uart
define: PBL_UART_STM32_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: 0
  # Not in the upstream binding: ports start at 115200 and their users set the rate
  - prop: current-speed
    default: 115200
  - flag: uart-has-rtscts
  - pinctrl: default
    optional: true
