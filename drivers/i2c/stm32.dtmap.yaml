compatible: st,stm32f4-i2c
config: I2C_STM32
class: i2c
define: PBL_I2C_STM32_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - irq: 1
  - clock: 0
  - reset: 0
  - prop: clock-frequency
    default: 100000
  - pinctrl: default
  - gpio: scl
  - gpio: sda
