compatible: st,stm32f42xx-rcc
config: CLK_STM32F4
class: clk
define: PBL_CLK_STM32F4_DEFINE
header: pbl/drivers/clk/stm32f4.h
provides:
  clock: "PBL_CLK(&{sym}, STM32F4_CLK_ID({0}, {1}))"
args:
  - name: true
  - reg: 0
