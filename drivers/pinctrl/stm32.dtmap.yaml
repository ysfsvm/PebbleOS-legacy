compatible: st,stm32f429-pinctrl
config: PINCTRL_STM32
class: pinctrl
pinctrl:
  define: PBL_PINCTRL_STM32_DT_STATE
  pinmux: "{value:#x}"
  flags:
    bias-disable: PBL_PINCTRL_STM32_BIAS_DISABLE
    bias-pull-up: PBL_PINCTRL_STM32_PULL_UP
    bias-pull-down: PBL_PINCTRL_STM32_PULL_DOWN
    drive-push-pull: PBL_PINCTRL_STM32_PUSH_PULL
    drive-open-drain: PBL_PINCTRL_STM32_OPEN_DRAIN
  values:
    slew-rate: "PBL_PINCTRL_STM32_SLEW({value})"
