# The GPIO banks of the pin controller, its gpio@ children
compatible: st,stm32f429-pinctrl
config: GPIO_STM32
class: gpio
define: PBL_GPIO_STM32_DEFINE
children:
  names:
    gpio: 0
  has: gpio-controller
args:
  - name: true
  - reg: 0
  - clock: 0
