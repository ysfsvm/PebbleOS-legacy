# GPIO banks and their pin interrupt controllers
compatible: st,stm32f429-pinctrl
config: GPIO_STM32
class: [gpio, intc]
symbol:
  gpio: "{sym}"
  intc: "{sym}_intc"
define: PBL_GPIO_STM32_DEFINE
children:
  names:
    gpio: 0
  has: gpio-controller
args:
  - name: true
  - reg: 0
  - clock: 0
  - reg: 0
    up: true
    of: interrupt-parent
  - reg: 0
    up: true
    of: st,syscfg
  - clock: 0
    up: true
    of: st,syscfg
  # gpio-hog children
  - list: []
    item:
      define: PBL_GPIO_STM32_HOG
      args:
        - prop: gpios
          index: 0
        - prop: gpios
          index: 1
        - flags:
            input: PBL_GPIO_INPUT
            output-low: PBL_GPIO_OUTPUT_INACTIVE
            output-high: PBL_GPIO_OUTPUT_ACTIVE
